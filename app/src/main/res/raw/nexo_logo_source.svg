<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente Turquesa (Principal) -->
    <linearGradient id="nexoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45D0B1" />
      <stop offset="100%" stop-color="#1B8779" />
    </linearGradient>

    <!-- Gradiente Azul (Secundário) -->
    <linearGradient id="nexoSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55B6DE" />
      <stop offset="100%" stop-color="#1F5B7A" />
    </linearGradient>
  </defs>

  <!-- Símbolo 'N' -->
  <!-- Desenhado com um corte central na diagonal para representar pacotes de dados e o "elo/nexo" -->
  <g transform="translate(100, 65)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Haste Esquerda e metade inferior da diagonal -->
    <path d="M 25 130 V 25 L 90 70.5" stroke="url(#nexoPrimary)" stroke-width="28" />

    <!-- Haste Direita e metade superior da diagonal -->
    <path d="M 175 25 V 130 L 110 84.5" stroke="url(#nexoSecondary)" stroke-width="28" />
  </g>

  <!-- Tipografia -->
  <!-- NEXO configurado em branco para refletir a interface de utilizador escura (Dark Mode) -->
  <text x="200" y="265" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">NEXO</text>

  <!-- TOOLS configurado na cor de destaque da interface -->
  <text x="204" y="305" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#45D0B1" text-anchor="middle" letter-spacing="12">TOOLS</text>
</svg>
